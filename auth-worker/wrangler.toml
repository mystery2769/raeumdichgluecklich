name = "raeumdichgluecklich-auth"
main = "src/index.js"
compatibility_date = "2026-01-01"

[vars]
# Komma-getrennt. Nur https – der Token darf nie unverschluesselt uebergeben
# werden. Die github.io-Adresse ist der Ausweichweg, solange das Zertifikat
# fuer die eigene Domain noch nicht ausgestellt ist.
ALLOWED_ORIGIN = "https://raeumdichgluecklich.ch,https://mystery2769.github.io"

# Secrets werden NICHT hier eingetragen, sondern einmalig gesetzt mit:
#   npx wrangler secret put CMS_USERNAME
#   npx wrangler secret put CMS_PASSWORD
#   npx wrangler secret put GITHUB_TOKEN
